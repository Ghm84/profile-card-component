<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
        <link rel = "stylesheet" href = "normalize.css">
        <link rel = "stylesheet" href = "style.css">
        <title>Profile Card Component</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class = "canvas">
            <div class = "top-pattern-div">
                <img class = "background-top-pattern" src = "images/bg-pattern-top.svg" alt = "">
            </div>
            <main class = "card">
                <div class = "card-container">
                    <div class = "header">
                        <img class = "header-img" src = "images/bg-pattern-card.svg" alt = "">
                    </div>
                    <div class = "avatar">
                        <img class = "avatar-img" src = "images/image-victor.jpg" alt = "">
                    </div>
                    <div class = "bio">
                        <h1 class = "name">Victor Crest</h1>
                        <h2 class = "age">26</h2>
                        <h3 class = "city">London</h3>
                    </div>
                    <div class = "hr-div">
                        <hr>
                    </div>
                    <div class = "metrics">
                        <div class = "numbers-div">
                            <h3 class = "followers-total">80K</h3>
                            <h3 class = "likes-total">803K</h3>
                            <h3 class = "photos-total">1.4K</h3>
                        </div>
                        <div class = "topic-div">
                            <h4 class = "followers-title">Followers</h4>
                            <h4 class = "likes-title">Likes</h4>
                            <h4 class = "photos-title">Photos</h4>
                        </div>
                    </div>
                </div>
            </main>
            <div class = "bottom-pattern-div">
                <img class = "background-bottom-pattern" src = "images/bg-pattern-bottom.svg" alt = "">
            </div>
        </div>
    </body>
</html>
